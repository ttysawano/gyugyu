name: tests
on: [push, pull_request]
jobs:
  php-sqlite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -v
          php -r 'exit(PHP_VERSION_ID >= 80300 && extension_loaded("pdo_sqlite") && extension_loaded("mbstring") ? 0 : 1);'
      - run: php tests/run.php
      - run: python3 tests/http_test.py
      - run: |
          while IFS= read -r -d '' file; do
            php -l "$file" || exit 1
          done < <(find src public bin tests -name '*.php' -print0)
      - run: node --test tests/*.test.mjs
      - run: |
          python3 -m venv /tmp/gyugyu-test-venv
          /tmp/gyugyu-test-venv/bin/pip install playwright==1.58.0
          /tmp/gyugyu-test-venv/bin/python -m playwright install --with-deps chromium
      - run: |
          export CHROMIUM_BINARY="$(/tmp/gyugyu-test-venv/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          /tmp/gyugyu-test-venv/bin/python tests/browser.py
          /tmp/gyugyu-test-venv/bin/python tests/candidate_browser.py
          /tmp/gyugyu-test-venv/bin/python tests/answer_browser.py
          /tmp/gyugyu-test-venv/bin/python tests/group_browser.py
      - run: git diff --check

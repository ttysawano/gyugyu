name: tests
on: [push, pull_request]
jobs:
  php-sqlite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: php -v && php -r 'exit(PHP_VERSION_ID >= 80300 && extension_loaded("pdo_sqlite") && extension_loaded("mbstring") ? 0 : 1);'
      - run: php tests/run.php
      - run: python3 tests/http_test.py
      - run: find src public bin tests -name '*.php' -exec php -l {} \;
      - run: git diff --check
